global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'cocos-challenge-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['api:8080']
        labels:
          application: 'cocos-challenge-api'
          environment: 'docker'
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'cocos-challenge-api'
          environment: 'local-ide'
